name: TURK Dil Kütüphanesi CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'  # Her pazar saat 02:00'de çalıştır

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Temel testler - tüm platformlarda
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable

    steps:
      - uses: actions/checkout@v3
      
      - name: Rust Kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      
      - name: Kargo paketlerini önbellekleme
        uses: Swatinem/rust-cache@v2
      
      - name: Derleme
        run: cargo build --verbose
      
      - name: Testler
        run: cargo test --verbose
      
      - name: Örnekler
        run: cargo run --example mnist_classifier
  
  # Linting - sadece Ubuntu üzerinde
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Kargo paketlerini önbellekleme
        uses: Swatinem/rust-cache@v2
      
      - name: Format kontrolü
        run: cargo fmt --all -- --check
      
      - name: Clippy kontrolü
        run: cargo clippy -- -D warnings
  
  # Güvenlik Denetimi
  security:
    name: Güvenlik Denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Cargo audit kurulumu
        run: cargo install cargo-audit
      
      - name: Bağımlılık denetimi
        run: cargo audit
      
      - name: Güvenli Rust kontrolü
        run: cargo install cargo-geiger && cargo geiger
  
  # Performans Benchmark
  benchmark:
    name: Performans Benchmark
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Kargo paketlerini önbellekleme
        uses: Swatinem/rust-cache@v2
      
      - name: Benchmark testleri çalıştır
        run: cargo bench
      
      - name: Benchmark sonuçlarını depola
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: target/criterion
  
  # Kod kapsama
  coverage:
    name: Kod Kapsama Analizi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview
      
      - name: Grcov kurulumu
        run: cargo install grcov
      
      - name: Kapsama verilerini topla
        run: |
          export LLVM_PROFILE_FILE="turk-%p-%m.profraw"
          export CARGO_INCREMENTAL=0
          export RUSTFLAGS="-Zinstrument-coverage"
          cargo build --verbose
          cargo test --verbose
      
      - name: Kapsama raporunu oluştur
        run: |
          grcov . --binary-path ./target/debug/ -s . -t lcov --branch --ignore-not-existing --ignore "/*" -o lcov.info
      
      - name: Coveralls'a yükle
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: lcov.info
  
  # Python binding testi
  python-binding:
    name: Python Binding Testi
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Python kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Kargo paketlerini önbellekleme
        uses: Swatinem/rust-cache@v2
      
      - name: Python binding derleme
        run: |
          pip install maturin pytest numpy
          maturin develop --features python
      
      - name: Python testleri çalıştır
        run: pytest -xvs python/tests/
  
  # WASM testi
  wasm-test:
    name: WebAssembly Testi
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      
      - name: wasm-pack kurulumu
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      - name: WASM paketi oluştur
        run: wasm-pack build --target web --features wasm
      
      - name: WASM testlerini çalıştır
        run: wasm-pack test --node --features wasm
  
  # Dokümantasyon
  docs:
    name: Dokümantasyon Oluşturma
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Kargo paketlerini önbellekleme
        uses: Swatinem/rust-cache@v2
      
      - name: Dökümanları oluştur
        run: cargo doc --no-deps --all-features
      
      - name: Boş dizin oluştur
        run: echo "<meta http-equiv=\"refresh\" content=\"0; url=turk_lang\">" > target/doc/index.html
      
      - name: GitHub Pages'e yayınla
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          publish_branch: gh-pages
          force_orphan: true
  
  # Sürüm paketi oluşturma
  release:
    name: Sürüm Paketini Oluştur
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      
      - name: Kargo paketlerini önbellekleme
        uses: Swatinem/rust-cache@v2
      
      - name: Rust sürümünü oluştur
        run: cargo package
      
      - name: wasm-pack kurulumu
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      - name: WASM paketi oluştur
        run: wasm-pack build --target web --features wasm
      
      - name: Python binding kurulumu
        uses: messense/maturin-action@v1
        with:
          command: build
          args: --release --features python --strip
      
      - name: Sürüm paketlerini depola
        uses: actions/upload-artifact@v3
        with:
          name: release-packages
          path: |
            target/package/turk-lang-*.crate
            pkg/
            target/wheels/
      
      - name: GitHub Sürümü Oluştur
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/package/turk-lang-*.crate
            pkg/*.tgz
            target/wheels/*.whl
          draft: true 