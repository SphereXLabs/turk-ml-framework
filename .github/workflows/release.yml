name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: turk
  GUI_BINARY_NAME: turk_gui

jobs:
  build:
    name: Build Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: turk-linux-amd64
            gui: false
          - os: windows-latest
            asset_name: turk-windows-amd64
            gui: true
          - os: macos-latest
            asset_name: turk-macos-amd64
            gui: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # plotters → fontconfig (cli feature); Ubuntu'da sistem paketi gerekir
      - name: Linux sistem bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: CLI Uygulamasını Derle
        run: cargo build --release --locked --features cli --bin ${{ env.BINARY_NAME }}

      - name: GUI Uygulamasını Derle (Windows)
        if: matrix.gui
        run: cargo build --release --locked --features gui --bin ${{ env.GUI_BINARY_NAME }}

      - name: CLI Binary'yi Adlandır (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/release
          mv ${{ env.BINARY_NAME }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: CLI Binary'yi Adlandır (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item target/release/${{ env.BINARY_NAME }}.exe target/release/${{ matrix.asset_name }}.exe

      - name: GUI Binary'yi Adlandır (Windows)
        if: matrix.gui && runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item target/release/${{ env.GUI_BINARY_NAME }}.exe target/release/${{ matrix.asset_name }}_gui.exe

      - name: CLI Artifact Yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}${{ runner.os == 'Windows' && '.exe' || '' }}
          path: target/release/${{ matrix.asset_name }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: GUI Artifact Yükle
        if: matrix.gui
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}_gui.exe
          path: target/release/${{ matrix.asset_name }}_gui.exe

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versiyon Bilgisini Çıkar
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Artifact'ları İndir
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Sürüm Oluştur
        uses: softprops/action-gh-release@v2
        with:
          name: TÜRK v${{ steps.get_version.outputs.version }}
          body: |
            # TÜRK v${{ steps.get_version.outputs.version }}

            ## Binary Dosyaları

            - Linux (x64): `turk-linux-amd64`
            - Windows (x64): `turk-windows-amd64.exe`, `turk-windows-amd64_gui.exe`
            - macOS (x64): `turk-macos-amd64`

            ## Kurulum

            Kurulum talimatları için lütfen [INSTALL.md](https://github.com/SphereXLabs/turk-ml-framework/blob/main/INSTALL.md) dosyasına bakın.
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          files: |
            artifacts/**/*
            LICENSE
            README.md
            INSTALL.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-alpha') && !contains(github.ref, '-beta')
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: crates.io token kontrolü
        id: crates_token
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CRATES_IO_TOKEN tanımlı değil; crates.io yayını atlanıyor."
          fi

      - name: crates.io'ya Yayınla
        if: steps.crates_token.outputs.available == 'true'
        run: cargo publish
