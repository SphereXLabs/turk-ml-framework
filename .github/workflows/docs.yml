name: Documentation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Dokümantasyonu Derle
        run: cargo doc --no-deps

      - name: İndeks Sayfası Ekle
        run: |
          echo '<meta http-equiv="refresh" content="0; url=turk/index.html">' > target/doc/index.html

      - name: wasm-pack Kur
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Playground HTML Kopyala
        run: |
          mkdir -p target/doc/playground
          cp playground/index.html target/doc/playground/index.html

      - name: WASM Playground Derle
        run: |
          wasm-pack build --target web --out-dir target/doc/playground/pkg \
            --no-default-features --features wasm
          rm -f target/doc/playground/pkg/.gitignore
          touch target/doc/.nojekyll

      - name: GitHub Pages'e Yükle
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          force_orphan: true
          enable_jekyll: false
