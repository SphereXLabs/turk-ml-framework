name: Rust CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  # Temel derlemeler ve testler
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GUI/sistem bağımlılıkları Windows'ta tam özellik seti
          - os: windows-latest
            rust: stable
            features: --all-features
          # Linux/macOS: windows-sys ve native GUI stack olmadan çekirdek + CLI
          - os: ubuntu-latest
            rust: stable
            features: --features "full,cli,csv"
          - os: macos-latest
            rust: stable
            features: --features "full,cli,csv"

    steps:
    - uses: actions/checkout@v4

    - name: Rust Sürümünü Kur
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Önbelleği Kur
      uses: Swatinem/rust-cache@v2

    - name: Derle
      run: cargo build ${{ matrix.features }}

    - name: Testleri Çalıştır
      run: cargo test ${{ matrix.features }}

  # Kod kalite kontrolleri
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Rust Sürümünü Kur
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Önbelleği Kur
      uses: Swatinem/rust-cache@v2

    - name: Kod Formatını Kontrol Et
      run: cargo fmt --all -- --check

    - name: Clippy ile Lint Kontrolü
      # GUI/ses native bağımlılıkları Linux runner'da yok; çekirdek + CLI
      # Örnek/bench hedefleri ayrı bakım ister; lib+bin+test ile CI kararlılığı korunur
      run: cargo clippy --lib --bins --tests --features "full,cli,csv" -- -D warnings

  # Dokümantasyon kontrolü
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Rust Sürümünü Kur
      uses: dtolnay/rust-toolchain@stable

    - name: Önbelleği Kur
      uses: Swatinem/rust-cache@v2

    - name: Dokümantasyonu Derle
      # --all-features GUI (gtk/alsa) ister; docs için çekirdek özellikler yeterli
      run: cargo doc --no-deps --features "full,cli,csv"

  # Kod kapsamı raporu (isteğe bağlı — tarpaulin kırılgan olabilir)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Rust Sürümünü Kur
      uses: dtolnay/rust-toolchain@stable

    - name: Önbelleği Kur
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin --version 0.27.3 --locked || true

    - name: Tarpaulin İle Kod Kapsamını Ölç
      run: cargo tarpaulin --features "full,cli,csv" --out Xml --exclude-files "tests/*" || true

    - name: Coveralls'a Yükle
      if: success()
      continue-on-error: true
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: ./cobertura.xml
