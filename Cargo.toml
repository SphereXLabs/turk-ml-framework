[package]
name = "turk"
version = "3.0.0"
edition = "2021"
authors = ["SphereX <turkdilmodeli@gmail.com>"]
description = "Türkçe yapay sinir ağı kütüphanesi"
license = "MIT"
repository = "https://github.com/SphereXLabs/turk-ml-framework"
# Sadece kütüphane olarak derleme yapmak için default-features
default-run = "turk"
readme = "README.md"
categories = ["science", "machine-learning", "neural-networks"]
keywords = ["turk", "turkish", "neural-network", "deep-learning", "ai"]

[lib]
name = "turk"
path = "src/lib.rs"

# Binary hedeflerini geçici olarak devre dışı bırakalım
# ileride düzeltilecek
[[bin]]
name = "turk"
path = "src/main.rs"

[[bin]]
name = "turk_gui"
path = "src/bin/turk_gui.rs"
required-features = ["gui"]

[[bin]]
name = "turk_sistem"
path = "src/bin/turk_sistem.rs"
required-features = ["turk_sistem"]

# Özellikleri (Features) yeniden düzenleyelim
[features]
default = ["csv"]
full = ["plotters", "indicatif", "colored", "chrono"]
cli = ["full", "clap"]
gui = ["full", "eframe", "egui_plot", "poll-promise", "rfd"]
# TÜRK Çekirdeği — yerel kişisel yapay zeka ekosistemi ve sistem otomasyonu
# Not: windows-sys yalnızca Windows hedefinde bağlanır (aşağıdaki target bağımlılığı).
turk_sistem = ["gui", "dep:sysinfo", "dep:tokio", "dep:reqwest", "dep:windows-sys", "chrono", "turk_ses"]
turk_ses = ["dep:cpal", "dep:hound"]
parallel = []
gpu = []
# Gelecek: turk-llm = ["turk_sistem", "dep:llama-cpp-2"]

[dependencies]
# Temel hesaplama kütüphaneleri
ndarray = { version = "0.15.4", features = ["serde", "rayon"] }
ndarray-rand = "0.14.0"
ndarray-stats = "0.5.1"

# Rastgele sayı üretimi
rand = "0.8.5"
rand_distr = "0.4.3"

# Serileştirme
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"

# Loglama ve hata yönetimi
log = "0.4.17"
# env_logger'ı en son sürüme güncelle
env_logger = "0.10.0"
thiserror = "1.0.38"

# Paralel işleme
rayon = "1.7.0"

# Metin işleme
regex = "1.7.1"
# once_cell'i ekleyelim ve lazy_static'i geri getirelim (geçiş için)
once_cell = "1.17.1"
lazy_static = "1.4.0"  # Eski kodlar hala bunu kullanıyor, ileride kaldırılacak
logos = "0.12.1"

# Seçimlik bağımlılıklar (feature flags ile kontrol edilir)
plotters = { version = "0.3.4", optional = true }
indicatif = { version = "0.17.3", optional = true }
colored = { version = "2.0.0", optional = true }
chrono = { version = "0.4.23", optional = true }
itertools = "0.14.0"
csv = { version = "1.2.1", optional = true }

# CLI için gerekli (opsiyonel)
clap = { version = "4.1.8", features = ["derive"], optional = true }

# GUI için gerekli (opsiyonel)
eframe = { version = "0.27", optional = true }
egui_plot = { version = "0.27", optional = true }
poll-promise = { version = "0.3.0", optional = true }
rfd = { version = "0.11.0", optional = true }

# TÜRK Sistem — yerel donanım ve asenkron süreç kütüphaneleri
sysinfo = { version = "0.30", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
cpal = { version = "0.15", optional = true }
hound = { version = "3.5", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Windows-only (optional): Linux/macOS CI'de çekilmez; turk_sistem özelliği ile açılır
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"], optional = true }

[dev-dependencies]
criterion = "0.5.1"
tempfile = "3.5.0"
pretty_assertions = "1.3.0"
approx = "0.5.1"
# MNIST veri setini sadece örnekler ve testler için kullanıyoruz
mnist = "0.5.0"

[[bench]]
name = "model_benchmarks"
harness = false

[[bench]]
name = "layer_benchmarks"
harness = false

[[bench]]
name = "optimizer_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # Binary boyutunu küçültmek için sembolleri kaldır

[profile.dev]
opt-level = 0
debug = true

[[example]]
name = "mnist_csv_export"
path = "examples/mnist_csv_export.rs"

[[example]]
name = "mnist_classifier"
path = "examples/mnist_classifier.rs"
required-features = ["full", "cli"]

[profile.bench]
debug = true
