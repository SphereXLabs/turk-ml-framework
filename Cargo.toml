[package]
name = "turk"
version = "0.1.0"
edition = "2021"
authors = ["SphereX <turkdilmodeli@gmail.com>"]
description = "Türkçe yapay sinir ağı kütüphanesi"
license = "MIT"
repository = "https://github.com/snnkr/turk"
# Sadece kütüphane olarak derleme yapmak için default-features
default-run = "turk"

[lib]
name = "turk"
path = "src/lib.rs"

# Binary hedeflerini geçici olarak devre dışı bırakalım
# ileride düzeltilecek
[[bin]]
name = "turk"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "turk_gui"
path = "src/bin/turk_gui.rs"
required-features = ["gui"]

# Özellikleri tanımlayalım
[features]
default = []
cli = []
gui = ["eframe", "poll-promise", "rfd"]

[dependencies]
ndarray = { version = "0.15", features = ["serde", "rayon"] }
ndarray-rand = "0.14"
ndarray-stats = "0.5"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.9"
log = "0.4"
rayon = "1.5"
regex = "1.5"
lazy_static = "1.4"
thiserror = "1.0"
anyhow = "1.0"
logos = "0.12"
mnist = "0.5"
plotters = "0.3"
chrono = "0.4"
csv = "1.1"
indicatif = "0.16"
colored = "2.0"
itertools = "0.14.0"

# GUI için gerekli olan kütüphaneler, isteğe bağlı
eframe = { version = "0.22.0", optional = true }
poll-promise = { version = "0.3.0", optional = true }
rfd = { version = "0.11.0", optional = true }

[dev-dependencies]
criterion = "0.3"
tempfile = "3.2"
pretty_assertions = "0.7"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[[example]]
name = "mnist_classifier"
path = "examples/mnist_classifier.rs"
